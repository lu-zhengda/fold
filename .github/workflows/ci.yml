name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint version
      - name: Check pull request standard
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'edited') &&
          github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./script/check-pr-standard.sh
      - name: Test, package, verify the disk image, and launch Fold
        run: ./script/verify.sh --launch
      - name: Upload Swift test coverage
        if: ${{ !cancelled() && hashFiles('.build/verification/coverage.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: swift-coverage
          path: .build/verification/coverage.json
          include-hidden-files: true
          if-no-files-found: error
