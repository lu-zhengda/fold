name: Release publish

# Builds, signs, notarizes, and publishes one Fold release, bumps the Homebrew
# cask, then installs that cask on a clean runner. Called by
# release-on-merge.yml after it has chosen the tag. GitHub-hosted macos-latest
# only. A release created with GITHUB_TOKEN does not trigger `release:
# published`, so verification runs here instead of in verify-release.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.2.0
        required: true
        type: string
      version:
        description: Version without the leading v
        required: true
        type: string
      build:
        description: CFBundleVersion for this version
        required: true
        type: string
      sha:
        description: Full commit SHA to build and tag
        required: true
        type: string
      pr_number:
        description: Merged pull request number, empty for a manual run
        required: false
        type: string
        default: ''
      pr_title:
        description: Merged pull request title, empty for a manual run
        required: false
        type: string
        default: ''
    secrets:
      MACOS_CERT_P12_BASE64:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
      APPSTORE_API_KEY_P8_BASE64:
        required: true
      APPSTORE_API_KEY_ID:
        required: true
      APPSTORE_API_ISSUER_ID:
        required: true
      SPARKLE_ED_PRIVATE_KEY:
        required: true
      HOMEBREW_TAP_TOKEN:
        required: true

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  RELEASE_SHA: ${{ inputs.sha }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.check.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Check the release inputs and checkout
        run: |
          set -euo pipefail
          source script/package.sh
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "checkout is not the release commit"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" || "$(bundle_build_number "$RELEASE_VERSION")" != "$RELEASE_BUILD" ]]; then
            echo "inconsistent release inputs: $RELEASE_TAG, $RELEASE_VERSION, $RELEASE_BUILD"
            exit 1
          fi

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Import the Developer ID certificate and notarization key
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/fold-signing.keychain-db
          P12_PATH: ${{ runner.temp }}/fold-developer-id.p12
          ASC_KEY_PATH: ${{ runner.temp }}/fold-authkey.p8
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/fold-sparkle-ed.key
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPSTORE_API_KEY_P8_BASE64 SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "$name is empty. Add it under Settings > Secrets and variables > Actions (see docs/RELEASING.md)."
              exit 1
            fi
          done
          # Workflow commands treat % and newlines as escapes.
          add_mask() {
            local value=$1
            value=${value//%/%25}
            value=${value//$'\r'/%0D}
            value=${value//$'\n'/%0A}
            echo "::add-mask::$value"
          }
          cert_password=$(printf '%s' "$MACOS_CERT_PASSWORD")
          add_mask "$cert_password"
          keychain_password=$(openssl rand -hex 32)
          add_mask "$keychain_password"
          trap 'rm -f "$P12_PATH"' EXIT

          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | openssl enc -d -base64 -A -out "$P12_PATH"
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | tr -d '[:space:]' | openssl enc -d -base64 -A -out "$ASC_KEY_PATH"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | tr -d '[:space:]' > "$SPARKLE_ED_KEY_FILE"
          test -s "$P12_PATH" || { echo "MACOS_CERT_P12_BASE64 decoded to an empty file"; exit 1; }
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$ASC_KEY_PATH" || { echo "APPSTORE_API_KEY_P8_BASE64 is not a PKCS#8 PEM key"; exit 1; }
          test -s "$SPARKLE_ED_KEY_FILE" || { echo "SPARKLE_ED_PRIVATE_KEY is empty after trimming"; exit 1; }

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$cert_password" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          printf '%s\n' "$identities"
          valid=$(grep -Ec '^ *[0-9]+\) [0-9A-F]{40} ' <<< "$identities" || true)
          developer_id=$(grep -E '^ *[0-9]+\) [0-9A-F]{40} "Developer ID Application: .* \(XY7H3QGJ2T\)"$' <<< "$identities" || true)
          if [[ "$valid" != 1 || -z "$developer_id" ]]; then
            echo "expected exactly one identity, Developer ID Application for team XY7H3QGJ2T"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$(awk '{print $2}' <<< "$developer_id")" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Fold.app and the disk image
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/fold-authkey.p8
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/fold-sparkle-ed.key
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          unset NOTARY_PROFILE
          ASC_KEY_ID=$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$APPSTORE_API_ISSUER_ID" | tr -d '[:space:]')
          export ASC_KEY_ID ASC_ISSUER_ID
          ./script/release.sh

      - name: Verify the signed release before publishing
        id: check
        run: |
          set -euo pipefail
          image="Fold-$RELEASE_VERSION.dmg"
          diff <(printf '%s\n' "$image" appcast.xml checksums.txt) <(cd dist && printf '%s\n' * | LC_ALL=C sort)
          (cd dist && shasum -a 256 -c checksums.txt)
          EXPECTED_BUILD=$RELEASE_BUILD ./script/verify-image.sh "dist/$image" "$RELEASE_VERSION" --distribution
          echo "sha256=$(shasum -a 256 "dist/$image" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fold-${{ inputs.tag }}
          path: |
            dist/Fold-${{ inputs.version }}.dmg
            dist/checksums.txt
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Delete the temporary keychain and keys
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/fold-signing.keychain-db
          P12_PATH: ${{ runner.temp }}/fold-developer-id.p12
          ASC_KEY_PATH: ${{ runner.temp }}/fold-authkey.p8
          SPARKLE_ED_KEY_FILE: ${{ runner.temp }}/fold-sparkle-ed.key
        run: |
          set -euo pipefail
          if [[ -f "$KEYCHAIN_PATH" ]]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$P12_PATH" "$ASC_KEY_PATH" "$SPARKLE_ED_KEY_FILE"
          for path in "$KEYCHAIN_PATH" "$P12_PATH" "$ASC_KEY_PATH" "$SPARKLE_ED_KEY_FILE"; do
            if [[ -e "$path" ]]; then
              echo "signing material still present after cleanup"
              exit 1
            fi
          done

  publish:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fold-${{ inputs.tag }}
          path: dist

      - name: Check the downloaded assets
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          image="Fold-$RELEASE_VERSION.dmg"
          diff <(printf '%s\n' "$image" appcast.xml checksums.txt) <(cd dist && printf '%s\n' * | LC_ALL=C sort)
          grep -Fx "$SHA256  $image" dist/checksums.txt
          (cd dist && shasum -a 256 -c checksums.txt)

      - name: Tag the release commit
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          remote=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$remote" ]]; then
            peeled=$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}' <<< "$remote")
            tagged=${peeled:-$(awk '{print $1; exit}' <<< "$remote")}
            if [[ "$tagged" != "$RELEASE_SHA" ]]; then
              echo "$RELEASE_TAG already points at $tagged, not $RELEASE_SHA; refusing to move it"
              exit 1
            fi
            echo "$RELEASE_TAG already points at $RELEASE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Fold $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)" = "$RELEASE_SHA"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "$RELEASE_TAG is already published"
              exit 1
            fi
            echo "removing the draft left by an interrupted upload"
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [[ -n "$PR_NUMBER" ]]; then
            printf '%s ([#%s](%s/%s/pull/%s))\n' "$PR_TITLE" "$PR_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_NUMBER" > "$notes"
          else
            printf 'Manual release of %s from main.\n' "$RELEASE_SHA" > "$notes"
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Fold $RELEASE_VERSION" --notes-file "$notes" --generate-notes \
            "dist/Fold-$RELEASE_VERSION.dmg" dist/checksums.txt dist/appcast.xml
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, .assets[].name'

  homebrew-cask:
    needs: [build, publish]
    runs-on: macos-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Bump Casks/fold.rb in lu-zhengda/homebrew-tap
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 VERSION=$RELEASE_VERSION
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then echo "HOMEBREW_TAP_TOKEN is empty"; exit 1; fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "unexpected version or sha256"
            exit 1
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --quiet https://github.com/lu-zhengda/homebrew-tap.git "$tap"
          cd "$tap"
          branch=$(git symbolic-ref --short refs/remotes/origin/HEAD)
          branch=${branch#origin/}
          cask=Casks/fold.rb
          if [[ "$(grep -c '^  version "' "$cask")" != 1 || "$(grep -c '^  sha256 "' "$cask")" != 1 ]]; then
            echo "$cask must have exactly one version line and one sha256 line"
            exit 1
          fi
          # The url interpolates the version, so it only changes if the asset name does.
          if ! grep -Fqx '  url "https://github.com/lu-zhengda/fold/releases/download/v#{version}/Fold-#{version}.dmg"' "$cask"; then
            echo "$cask url no longer matches Fold-<version>.dmg; update the cask by hand"
            exit 1
          fi
          perl -pi -e 's/^  version ".*"$/  version "$ENV{VERSION}"/; s/^  sha256 ".*"$/  sha256 "$ENV{SHA256}"/' "$cask"
          grep -Fqx "  version \"$VERSION\"" "$cask"
          grep -Fqx "  sha256 \"$SHA256\"" "$cask"
          if command -v ruby >/dev/null; then ruby -c "$cask"; fi
          if git diff --quiet; then
            echo "$cask already has fold $VERSION"
            exit 0
          fi
          git diff
          header=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$header"
          trap 'git config --unset-all http.https://github.com/.extraheader || true' EXIT
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $header"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "fold $VERSION"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:refs/heads/$branch"; then
              echo "pushed fold $VERSION to $branch"
              exit 0
            fi
            echo "push attempt $attempt was rejected; rebasing on $branch"
            git pull --quiet --rebase origin "$branch"
          done
          echo "could not push the cask update"
          exit 1

  verify-published-release:
    needs: [publish, homebrew-cask]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # verify-release.sh downloads the assets and checks the SHA-256, the
      # Developer ID signature, stapling, and Gatekeeper on the DMG and its app,
      # taps lu-zhengda/tap fresh, checks the cask version/sha256/url, runs
      # `brew install --cask lu-zhengda/tap/fold`, then on /Applications/Fold.app
      # runs codesign --verify --deep --strict, xcrun stapler validate,
      # spctl --assess --type execute -vv (source=Notarized Developer ID), the
      # version and build checks, and a launch smoke test.
      - name: Install the published cask and verify Fold.app
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          ./script/verify-release.sh --install-cask "$RELEASE_TAG"
