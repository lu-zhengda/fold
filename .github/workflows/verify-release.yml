name: Verify published Fold

# Manual re-verification of a published release. Releases are created by
# release-publish.yml with GITHUB_TOKEN, which does not trigger
# `release: published`; that workflow runs the same script in its
# verify-published-release job.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version (leave blank for latest)'
        type: string
      install_cask:
        description: 'Install and launch the current Homebrew cask'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify downloaded release and selected installation path
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          INSTALL_CASK: ${{ inputs.install_cask }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$INSTALL_CASK" == true ]]; then args+=(--install-cask); fi
          if [[ -n "$VERSION" ]]; then args+=("$VERSION"); fi
          ./script/verify-release.sh ${args[@]+"${args[@]}"}
